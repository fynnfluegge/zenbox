set-option -sa terminal-overrides ",xterm*:Tc"

# don't quit tmux on exit
set-option -g detach-on-destroy off

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Enter tmux-yank copy mode in terminal with prefix + [
# Leave copy mode with y
set -g @plugin 'tmux-plugins/tmux-yank'

# Save tmux sessions with prefix + Ctrl-s
# Restore tmux sessions with prefix + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# show window name (not cwd) in the active tab
# (catppuccin hardcodes pane_current_path in window-status-current-format)
set -g window-status-current-format "#[fg=colour232,bg=#fab387] #I #[fg=colour255,bg=colour237] #W "

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# border colours
set -g pane-active-border-style bg=default,fg="#3b3f54"
set -g pane-border-style fg="#3b3f54"
set -g mouse on

# keep at bottom since treesitter parser has issues
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -v -c "#{pane_current_path}"

# ensure session finder script is executable
if "test -f ~/.config/tmux/tmux-session-finder && ! -x ~/.config/tmux/tmux-session-finder" \
   "run 'chmod +x ~/.config/tmux/tmux-session-finder'"

# ensure shortcuts script is executable
if "test -f ~/.config/tmux/tmux-shortcuts && ! -x ~/.config/tmux/tmux-shortcuts" \
   "run 'chmod +x ~/.config/tmux/tmux-shortcuts'"

# bind session finder to prefix + f (switch between existing sessions)
bind-key -r f display-popup -E "~/.config/tmux/tmux-session-finder"

# bind shortcuts helper to prefix + h
bind-key h display-popup -E "~/.config/tmux/tmux-shortcuts"

# bind config reload to prefix + r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
